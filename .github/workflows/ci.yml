name: Phase 1 validation
on:
  push:
    branches: [main, phase-1-recovery]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: phase1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      valkey:
        image: valkey/valkey:8.1.4-alpine
        ports: ["16379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      APP_MODE: demo
      QUEUE_URL: redis://127.0.0.1:16379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm run setup
      - run: npm run state:check
      - run: npm run check
      - run: npm run format:check
      - run: npm run test:worker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Compose builds and health checks
        env:
          POSTGRES_PASSWORD: ci-synthetic-only
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 120
          curl --fail http://127.0.0.1:3000/api/health
      - name: Stop local containers
        if: always()
        env:
          POSTGRES_PASSWORD: ci-synthetic-only
        run: docker compose down
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
